name: 'CI: pull request'

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pull_request_job:
    name: CI
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-pull-request.yml@main
    secrets: inherit
